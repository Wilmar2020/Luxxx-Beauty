<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LUXXX Beauty by Erika Baez</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300&family=Jost:wght@300;400&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
:root{--ink:#0b0807;--wine:#2a0d10;--rose:#d8a28c;--rose2:#b97a64;--cream:#f2e4da;--bg:#eae0d6;--text:#2b1b16;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font:300 1.05rem/1.7 'Jost',system-ui,sans-serif}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;font-weight:300;margin:0;line-height:1}
.script{font-family:'Pinyon Script','Snell Roundhand',cursive;color:var(--rose)}
#gl{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
.hero{position:relative;z-index:0;height:100vh;min-height:560px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;padding:12vh 1.2rem 7vh;background:var(--bg)}
.hero h1{margin:0;width:100%;display:flex;justify-content:center}.hero h1 img{width:clamp(280px,62vw,680px);height:auto;display:block}
.hero .tag{font:italic 300 clamp(1.3rem,3.2vw,2rem)/1.2 'Cormorant Garamond',serif;color:var(--text);position:relative;z-index:2}
.hero small{display:block;margin-top:.8rem;letter-spacing:.3em;font-size:.72rem;color:#a8624b}
.prod{position:relative;z-index:2;min-height:140vh;display:flex;align-items:center;padding:0 clamp(1.2rem,7vw,6rem)}
.prod .col{max-width:26rem;padding:1rem 0}
.prod h2{font-size:clamp(2.4rem,5vw,4rem);margin-bottom:1.4rem}
.prod p{margin:.2rem 0 1.1rem;color:#5a463d}
.prod b{font:500 1.5rem 'Cormorant Garamond',serif;color:#a8624b;display:block}
.cover{position:relative;z-index:2;background:var(--bg)}
.story{padding:14vh clamp(1.2rem,7vw,6rem) 8vh;display:grid;grid-template-columns:1fr 1fr;gap:clamp(1.5rem,5vw,5rem);align-items:end}.story h2{font-size:clamp(2.6rem,6vw,5rem)}.story p{max-width:30rem;margin:0 0 1rem;color:#5a463d}.faces{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;padding:0 .5rem 10vh}.faces img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block}
.shop{padding:14vh clamp(1.2rem,7vw,6rem);background:var(--wine);color:var(--cream)}
.shop h2{font-size:clamp(2.6rem,6vw,5rem);text-align:center;margin-bottom:3rem}
.items{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1.2rem;max-width:62rem;margin:0 auto}
.item{border:1px solid rgba(216,162,140,.45);padding:2.2rem 1.4rem;text-align:center}
.item h3{font-size:1.9rem;margin-bottom:.5rem}
.item span{color:var(--rose);font-size:.9rem;letter-spacing:.12em}
.contact{display:grid;grid-template-columns:1fr 1fr;min-height:90vh}

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
var cv=document.getElementById('gl'),W,H;
var rn=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});
rn.setPixelRatio(Math.min(devicePixelRatio,2));rn.outputEncoding=THREE.sRGBEncoding;
var sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(32,1,.1,60);
var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

sc.add(new THREE.AmbientLight(0xffe8dc,.22));
var key=new THREE.DirectionalLight(0xffd9c4,1.05);key.position.set(4,6,6);sc.add(key);
var rim=new THREE.PointLight(0xd8a28c,2.2,30);rim.position.set(-5,3,-3);sc.add(rim);
var fill=new THREE.PointLight(0xffffff,.35,30);fill.position.set(0,2,8);sc.add(fill);

var black=new THREE.MeshStandardMaterial({color:0x040303,roughness:.32,metalness:.2});
var gold=new THREE.MeshStandardMaterial({color:0xe0a58c,roughness:.28,metalness:.7,emissive:0x3a1d12});

function label(w,h,draw){var c=document.createElement('canvas');c.width=w;c.height=h;var x=c.getContext('2d');x.textAlign='center';draw(x,w,h);var t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=4;return {t:t,c:c,x:x,draw:draw,w:w,h:h}}
function lm(l){return new THREE.MeshBasicMaterial({map:l.t,transparent:true,depthWrite:false})}
var labels=[];
function mk(w,h,d){var l=label(w,h,d);labels.push(l);return l}
function tag(x,w,y,s){x.fillStyle='#d9a58f';x.font='500 '+s+'px "Cormorant Garamond",serif';x.fillText('LUXXX',w/2,y)}
var Lb=mk(512,512,function(x,w,h){x.clearRect(0,0,w,h);tag(x,w,190,130);x.font='400 36px Jost,sans-serif';x.fillText('B E A U T Y',w/2,250);x.font='68px "Pinyon Script",cursive';x.fillText('by Erika Baez',w/2,350)});
var Lc=mk(512,512,function(x,w,h){x.clearRect(0,0,w,h);tag(x,w,230,130);x.font='400 36px Jost,sans-serif';x.fillText('B E A U T Y',w/2,290);x.font='68px "Pinyon Script",cursive';x.fillText('by Erika Baez',w/2,390)});
var Ll=mk(256,256,function(x,w,h){x.clearRect(0,0,w,h);tag(x,w,140,54)});

function cyl(rt,rb,h,m,y,p){var o=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,48),m);o.position.y=y;p.add(o);return o}

var bottle=new THREE.Group();
cyl(.55,.55,1.6,black,.8,bottle);cyl(.28,.55,.3,black,1.75,bottle);cyl(.28,.28,.12,black,1.96,bottle);
cyl(.31,.31,.38,gold,2.2,bottle);cyl(.17,.17,.55,black,2.66,bottle);
var bs=new THREE.Mesh(new THREE.SphereGeometry(.17,32,16),black);bs.position.y=2.94;bottle.add(bs);
var bl=new THREE.Mesh(new THREE.CylinderGeometry(.556,.556,1.3,48,1,true,-1.0,2.0),lm(Lb));bl.position.y=.95;bottle.add(bl);

var compact=new THREE.Group();
var cb=new THREE.Mesh(new THREE.BoxGeometry(1.5,1.5,.46),black);cb.position.y=.75;compact.add(cb);
var ce=new THREE.Mesh(new THREE.BoxGeometry(.07,1.5,.47),gold);ce.position.set(-.72,.75,0);compact.add(ce);
var cl=new THREE.Mesh(new THREE.PlaneGeometry(1.3,1.3),lm(Lc));cl.position.set(.04,.75,.232);compact.add(cl);

var lip=new THREE.Group();
cyl(.3,.3,.9,black,.45,lip);cyl(.306,.306,.07,gold,.92,lip);cyl(.29,.29,1.1,black,1.5,lip);cyl(.296,.296,.04,gold,2.07,lip);
var ll=new THREE.Mesh(new THREE.CylinderGeometry(.302,.302,.45,48,1,true,-.9,1.8),lm(Ll));ll.position.y=.42;lip.add(ll);
var cap=new THREE.Mesh(new THREE.BoxGeometry(.5,.5,.5),gold);cap.position.set(.75,.25,.3);cap.rotation.y=.5;

var rig=new THREE.Group(),FL=-1.35;
bottle.scale.setScalar(.82);bottle.position.set(0,FL,0);
compact.scale.setScalar(.92);compact.position.set(-1.65,FL,-.25);compact.rotation.y=0;
lip.scale.setScalar(.85);lip.position.set(1.55,FL,-.1);
rig.add(bottle,compact,lip);sc.add(rig);



function redraw(){labels.forEach(function(l){l.draw(l.x,l.w,l.h);l.t.needsUpdate=true})}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(redraw);
if(document.fonts&&document.fonts.load){document.fonts.load('68px "Pinyon Script"');document.fonts.load('500 100px "Cormorant Garamond"')}

var sy=0,P=0,mob=false;
function size(){W=innerWidth;H=innerHeight;rn.setSize(W,H,false);cam.aspect=W/H;cam.updateProjectionMatrix();mob=W<760;compact.position.x=mob?-1.1:-1.65;lip.position.x=mob?1.2:1.55}
addEventListener('resize',size);size();
addEventListener('scroll',function(){sy=scrollY},{passive:true});
function sm(a,b,x){x=Math.min(1,Math.max(0,(x-a)/(b-a)));return x*x*(3-2*x)}

function frame(t){
  t*=.001;var vh=H;
  P=Math.min(1,sy/(vh*2));
  var f=sm(2.0*vh,2.45*vh,sy);
  cv.style.opacity=1-f;cv.style.visibility=f>=1?'hidden':'visible';
  var sp=P*Math.PI*2,drift=reduce?0:Math.sin(t*.6)*.14;
  bottle.rotation.y=sp+drift;compact.rotation.y=sp*-1+.3+drift;lip.rotation.y=sp+.5-drift;
  var off=mob?0:sm(.15,.6,P)*1.7;
  rig.position.x=off;rig.position.y=reduce?0:Math.sin(t*.8)*.06;
  var sc2=mob?.78:1;rig.scale.setScalar(sc2);
  cam.position.set(0,1.1-P*.5,(mob?12.5:11.5)-sm(0,.5,P)*1.5);cam.lookAt(off*.4,.35,0);
    rn.render(sc,cam);requestAnimationFrame(frame)
}
requestAnimationFrame(frame);
})();
</script>
